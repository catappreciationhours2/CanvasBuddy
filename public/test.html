<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>Perfect Artist + Audit · CanvasBuddy</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#faf7ff;color:#34323D;margin:0;padding:20px;max-width:1100px;margin-inline:auto}
h1{margin:0 0 4px}.sub{color:#6b6880;margin:0 0 16px}
button,select{font:inherit;border:0;background:#7c6bd6;color:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;margin:0 8px 8px 0}button.alt,select{background:#e9e3fa;color:#34323D}
.bar{display:flex;flex-wrap:wrap;align-items:center;background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;gap:4px}
#drop{border:2px dashed #c9b8f0;border-radius:14px;padding:12px 16px;margin:0 12px 8px 0;cursor:pointer}#drop.drag{background:#f0eaff}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:12px;overflow:hidden;margin:8px 0}td,th{padding:7px 10px;text-align:left;border-bottom:1px solid #eee;font-size:13.5px;vertical-align:top}
.pass{color:#1d8a52;font-weight:700}.fail{color:#c23b55;font-weight:700}.warn{color:#b27a00;font-weight:700}
.stages{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stages figure{margin:0;text-align:center;font-size:12px}canvas{background:#fff;border:1px solid #ddd;border-radius:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:12px 0}.stepcard{background:#fff;border-radius:14px;padding:10px;font-size:13px}
.ov{position:relative;line-height:0;border-radius:10px;overflow:hidden}.ov img{width:100%;filter:grayscale(.2) brightness(1.05)}.ov svg{position:absolute;inset:0;width:100%;height:100%}
.cav{background:#fff6e0;border-radius:12px;padding:10px 16px;font-size:14px}h2{margin:18px 0 6px}
</style></head><body>
<h1>🎯 Perfect Artist + 🛡️ Audit Agent</h1>
<p class="sub">Upload <b>any</b> reference image (a photo, painting, drawing…). The app builds a lesson (offline or via your AI key), then an independent auditor replays it and checks every marker against the image’s own pixels.</p>
<div class="bar">
  <label id="drop">📁 Drop an image here or click<input id="file" type="file" accept="image/*" hidden></label>
  <select id="sample"><option value="samples/sample-cat.svg">Line-art cat</option><option value="samples/sample-landscape.svg">Landscape</option><option value="samples/sample-pixel.svg">Pixel mushroom</option></select>
  <select id="mode"><option value="sketch">Sketch lesson</option><option value="sketch_paint">Sketch, then paint</option><option value="paint">Paint lesson</option><option value="style">Style study</option></select>
  <label class="chk"><input type="checkbox" id="construct" checked> shapes first (sketch modes)</label> <label class="chk"><input type="checkbox" id="precise" checked> follow line art</label>
  <select id="model" title="Per-call model override (allow-listed on the server)"><option value="">Model: server default</option></select>
  <select id="medium"><option>Digital sketching</option><option>Charcoal</option><option>Graphite pencil</option><option>Oil painting</option><option>Watercolor</option><option>Pixel art</option></select>
  <button id="runLocal">Run: offline lesson</button><button id="runAi">Run: AI lesson (uses server key)</button><button id="runBroken" class="alt">Run: deliberately broken lesson</button><button id="runAttack" class="alt">Adversarial suite</button><button id="runRed" class="alt">🛡️ Security stress test</button><button id="dl" class="alt">Download debug bundle</button>
  <span id="status" style="margin-left:8px;font-size:13px"></span>
</div>
<div id="out"></div>
<script type="module" src="js/harness.js"></script></body></html>
